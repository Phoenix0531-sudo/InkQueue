<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">InkQueue</title>
  <desc id="desc">Agent-synced task queue for e-ink devices. Kindle views, completes, and postpones; the Agent writes the queue.</desc>

  <rect width="1200" height="360" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <!-- left rule -->
  <rect x="48" y="48" width="4" height="264" fill="#000000"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#000000">
    <text x="72" y="78" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">E-INK · ANDROID 4.4 · minSdk 19</text>
    <text x="72" y="148" font-size="72" font-weight="700">InkQueue</text>
    <text x="72" y="196" font-size="26">Agent writes the queue. Kindle executes it.</text>
    <text x="72" y="238" font-size="18" fill="#333333">Native Java · Canvas self-draw · ~96 KB APK · zero AndroidX</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="72" y="292">v0.9.2</text>
      <text x="160" y="292">·</text>
      <text x="180" y="292">32 server + 16 triage tests</text>
      <text x="430" y="292">·</text>
      <text x="450" y="292">B1 closed-loop on PW3</text>
    </g>
  </g>

  <!-- right device card -->
  <g transform="translate(760 42)">
    <rect x="0" y="0" width="380" height="276" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <rect x="18" y="18" width="344" height="36" fill="#000000"/>
    <text x="34" y="42" fill="#FFFFFF" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-weight="700">任务 · 已同步 21:23</text>

    <text x="34" y="86" fill="#000000" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">过期   今日   本周   以后   已做</text>
    <rect x="86" y="94" width="42" height="3" fill="#000000"/>

    <text x="34" y="136" fill="#000000" font-size="20" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-weight="700">今日</text>
    <line x1="34" y1="148" x2="346" y2="148" stroke="#000000" stroke-width="1"/>

    <text x="34" y="182" fill="#000000" font-size="18" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">□  B1真机闭环验证任务</text>
    <text x="58" y="208" fill="#333333" font-size="14" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">今天 · InkQueue</text>

    <text x="34" y="246" fill="#000000" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Agent → server → Kindle</text>
  </g>
</svg>
