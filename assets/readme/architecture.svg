<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">InkQueue architecture</title>
  <desc id="desc">Three layers: Agent CLI writes tasks, LAN server is source of truth, Kindle e-ink app views and completes.</desc>

  <rect width="1200" height="320" rx="18" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" fill="#000000">
    <text x="48" y="48" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SYSTEM MAP</text>
    <text x="48" y="84" font-size="34" font-weight="700">Agent writes · Server owns · Kindle executes</text>
  </g>

  <!-- three boxes -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="48" y="120" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="72" y="158" font-size="22" font-weight="700" fill="#000000">1 · Agent</text>
    <text x="72" y="192" font-size="16" fill="#333333">inkq CLI / MCP shell</text>
    <text x="72" y="220" font-size="16" fill="#333333">add · patch · triage · events</text>
    <text x="72" y="248" font-size="15" fill="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">interface.md contract</text>

    <rect x="440" y="120" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="464" y="158" font-size="22" font-weight="700" fill="#000000">2 · Server</text>
    <text x="464" y="192" font-size="16" fill="#333333">snapshot · operations</text>
    <text x="464" y="220" font-size="16" fill="#333333">webhook · prune · device_id</text>
    <text x="464" y="248" font-size="15" fill="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">:8787 JSON store</text>

    <rect x="832" y="120" width="320" height="150" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="856" y="158" font-size="22" font-weight="700" fill="#000000">3 · Kindle</text>
    <text x="856" y="192" font-size="16" fill="#333333">view · complete · postpone</text>
    <text x="856" y="220" font-size="16" fill="#333333">offline queue · local cache</text>
    <text x="856" y="248" font-size="15" fill="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">minSdk 19 · ~55 KB</text>
  </g>

  <!-- arrows -->
  <g stroke="#000000" stroke-width="2" fill="none">
    <path d="M368 195 H430"/>
    <path d="M760 195 H822"/>
  </g>
  <g fill="#000000">
    <polygon points="430,195 418,189 418,201"/>
    <polygon points="822,195 810,189 810,201"/>
  </g>
</svg>
